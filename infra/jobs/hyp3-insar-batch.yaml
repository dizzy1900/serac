# serac job manifest — HyP3 InSAR batch for one AOI.
# Generic container-host description; the aws: block is annotation only. See infra/jobs/README.md.
# Status: designed, never executed. Every estimate states its basis.

apiVersion: serac.jobs/v0
kind: ContainerJob

metadata:
  name: hyp3-insar-batch
  description: >
    Plan same-orbit Sentinel-1 pairs for an AOI and date range (max_days apart), submit them
    as HyP3 InSAR jobs, --wait until they finish, download the products to
    data/raw/hyp3_insar/<aoi>/,
    and append a ledger entry per product (status: requested -> fetched). The heavy compute
    (interferogram formation) runs on ASF's HyP3 service, not in this container; this job is
    I/O-bound.
  owner_role: eo-data-engineer
  status: designed

image: "<registry>/serac:<git-sha>"

command:
  - serac
  - ingest
  - hyp3
  - --aoi
  - "${aoi_id}"
  - --from
  - "${date_from}"
  - --to
  - "${date_to}"
  - --max-days
  - "${max_days}"
  - --wait
  - --yes

# The unattended half of the lifecycle: it submits nothing, refreshes the states of jobs
# already in data/raw/hyp3_insar/<aoi>/jobs.jsonl and downloads the ones that have
# succeeded. Re-runnable, and the task to use after a --wait timed out or the container was
# reclaimed. `--poll` takes neither --dry-run nor --yes.
followup_command:
  - serac
  - ingest
  - hyp3
  - --aoi
  - "${aoi_id}"
  - --from
  - "${date_from}"
  - --to
  - "${date_to}"
  - --max-days
  - "${max_days}"
  - --poll

parameters:
  aoi_id: lhende-khola-trishuli        # or chamoli-rishiganga, blatten-lotschental
  date_from: "2025-01-01"
  date_to: "2026-08-31"
  max_days: "12"                       # pair temporal baseline in days (--max-days)

env:
  - name: EARTHDATA_USERNAME
    from: secret:EARTHDATA_USERNAME
  - name: EARTHDATA_PASSWORD
    from: secret:EARTHDATA_PASSWORD
  - name: SERAC_DATA_DIR
    from: value:/data

resources:
  cpu: 2
  memory_gb: 8
  gpu: 0
  storage_gb: 200                      # scratch for downloads before dvc push

parallelism:
  array_size: 1                        # one task per AOI; pairs are submitted in bulk inside the task
  shard_by: aoi_id

estimated_core_hours:
  low: 1
  high: 10
  basis: >
    ASSUMPTION, not a measurement. The container only plans pairs, submits jobs, polls, and
    downloads; per-product wall time is dominated by HyP3 queue time and download bandwidth.
    Range assumes tens to a few hundred pairs per AOI-year at 2 vCPU. Nothing has been run.

estimated_storage_gb:
  low: 10
  high: 200
  basis: >
    ASSUMPTION. Depends on the number of pairs and the HyP3 product options selected. HyP3
    publishes no product size before a job completes, so the plan carries
    estimated_bytes = null and --dry-run prints "unknown": there is no per-run number to
    compare this range against before submission, and the ask-first gate therefore fires on
    every run (see preconditions).

inputs:
  - data/aoi/${aoi_id}/                # committed to git; no dvc pull needed
  - data/manifest.jsonl                # git-tracked ledger (ADR-0004)

outputs:
  - data/raw/hyp3_insar/${aoi_id}/     # DVC-tracked; operator runs dvc push afterwards
  - data/manifest.jsonl                # appended, then committed

ledger:
  - source: hyp3_insar
    statuses: [requested, fetched, failed, not_fetched]

preconditions:
  - Earthdata Login credentials present in the host secret store (docs/CREDENTIALS.md).
  - A serac ingest hyp3 --dry-run has been run and the pair list it prints reviewed. Its byte
    estimate is "unknown" by construction, so review the pair count and the credit warning.
  - >
    The submit task needs an attached stdin. Because the size is unknown, the 5 GiB ask-first
    gate (SIZE_GATE_BYTES in src/serac/adapters/eo/_base.py) asks before any download on
    every run; with stdin closed the prompt aborts, nothing is submitted and nothing is
    downloaded. Run this task interactively (docker run -i, or a Batch job you attach to) and
    answer at the prompt; the operator's answer belongs in the run notes. Only
    followup_command runs unattended -- it downloads jobs already confirmed at submission and
    submits nothing.
  - An operator confirmation is recorded in the run notes, whatever the realised size.
  - dvc remote configured (make dvc-remote) so outputs can be pushed.

aws:
  note: annotation only; any container host can run this job from the generic fields above.
  instance_family: m6i                 # general purpose; I/O-bound, no GPU
  suggested_instance: m6i.large
  batch_job_definition:
    type: container
    containerProperties:
      image: "<registry>/serac:<git-sha>"
      vcpus: 2
      memory: 8192
      command: ["serac", "ingest", "hyp3", "--aoi", "Ref::aoi_id", "--from", "Ref::date_from", "--to", "Ref::date_to", "--max-days", "Ref::max_days", "--wait", "--yes"]
      secrets:
        - name: EARTHDATA_USERNAME
          valueFrom: "<secrets-manager arn>"
        - name: EARTHDATA_PASSWORD
          valueFrom: "<secrets-manager arn>"
      volumes:
        - name: scratch
          host: { sourcePath: /scratch }
      mountPoints:
        - containerPath: /data
          sourceVolume: scratch
    retryStrategy: { attempts: 2 }
    timeout: { attemptDurationSeconds: 43200 }
