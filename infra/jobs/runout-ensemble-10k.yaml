# serac — scaled runout ensemble (10^4 members), portable container-host manifest.
# Written for a generic container host; AWS Batch annotations are advisory, not a dependency.
#
# Every number below has a stated `basis:`. Where the basis is a measurement, it names the file
# the measurement is in. Where it is an extrapolation, it says so and gives the exponent used.
apiVersion: serac.dev/v0
kind: BatchJob
metadata:
  name: runout-ensemble-10k
  component: M4
  solver: serac-swe-voellmy
  solver_version: "0.1.0"
  disclaimer: >-
    NOT r.avaflow. This job runs the in-repo single-phase Voellmy-Salm substitute; see
    infra/docker/ravaflow/README.md. Cross-validation against r.avaflow is outstanding.

spec:
  command: ["serac", "runout", "run", "--repo", "/work", "--workers", "$(NPROC)"]
  parallelism:
    members: 10000
    array_shards: 200          # 50 members per shard
    basis: >-
      Members are independent and the driver is resume-safe by input hash, so shard size is a
      scheduling choice only. 50 keeps a shard under ~8 h at the measured 30 m cost.

  container:
    image: ghcr.io/dizzy1900/serac:0.1.0     # built from infra/docker/Dockerfile
    vcpu: 8
    memory_gib: 16
    basis: >-
      Memory measured, not assumed: one 30 m corridor terrain is 2040 x 1751 cells and the
      solver holds ~10 float64 arrays over an active window, giving roughly 0.4 GB per worker
      process. 8 workers x 0.4 GB plus the parent leaves headroom in 16 GiB.

  storage:
    per_member_bytes: 8_400_000
    basis: >-
      Measured on 30 m members: four deflate COGs on a 2040 x 1751 grid plus corridor.parquet
      and run.json. See reports/runout/ensemble_summary.json for the realised total.
    total_gib: 79
    total_basis: "10000 members x 8.4 MB, rounded up."
    scratch_gib: 20
    scratch_basis: "One conditioned terrain per resolution plus the DEM crop (12.4 MiB)."

  compute:
    core_hours: 1389
    basis: >-
      MEASURED per-member wall clock at 30 m is in reports/runout/timing.json. The ensemble
      mean is dominated by low-mu members, which run to the simulated-time limit. Core-hours =
      10000 members x mean single-core seconds / 3600. Substitute the realised mean from
      reports/runout/ensemble_summary.json (`wall_time_total_core_s`) before committing spend;
      this figure is an extrapolation from a 200-member sample, not a measurement of 10^4.
    wall_clock_hours_at_200_shards: 7
    wall_clock_basis: "core_hours / (200 shards x 8 vCPU), plus ~10% scheduling overhead."

  aws:
    service: Batch
    compute_environment: EC2 Spot
    instance_types: ["c7g.2xlarge", "c6g.2xlarge"]   # arm64 Graviton; the solver is pure numpy
    instance_basis: >-
      The solver is memory-bandwidth bound on numpy array traffic, not FLOP bound, so a
      compute-optimised Graviton instance is the cheapest fit. No GPU is used or needed.
    storage: "S3 for outputs; the ledger is written per shard and concatenated on completion."

  preconditions:
    - "reports/runout/ENSEMBLE_FROZEN.md exists and its design hash is unchanged."
    - "SOLVER_VERSION matches the frozen design; a bump invalidates the ensemble by design."
    - "The corridor GLO-30 crop is in the ledger with status fetched."

  notes: >-
    Do not launch without confirmation: this is a paid job. The 200-member local ensemble in
    reports/runout/ is the evidence base for every gate in validate-runout; 10^4 buys a denser
    Latin hypercube, not a better solver. Cross-validation against r.avaflow would be a better
    use of the same money.
