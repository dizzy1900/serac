name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # validate-watch proves against git that the pre-registration commit precedes the
          # backtest commit. A shallow clone resolves every path to the grafted tip, so that
          # check cannot be evaluated at all without full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (strict)
        run: uv run mypy --strict src
      - name: Offline tests (network blocked)
        run: uv run pytest -n auto -m "not online and not redis"
      # The gates are the point of this repository, and until now CI ran none of them: a
      # green tick meant lint, types and tests only. Every suite runs offline from committed
      # fixtures. `--allow-unmet` names the criteria of the brief that this repository
      # already reports as unmet in RELEASE_STATUS.md and the M1 model card; any other unmet
      # criterion, and any broken suite, fails the run.
      - name: Validation gates
        run: |
          uv run serac validate all \
            --allow-unmet 'forced_groups_detected[loro_hma],forced_groups_detected[time_forward]'
      - name: Avoided loss computes
        run: uv run serac underwriting-check
